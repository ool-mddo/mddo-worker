---
# 各ホストのアドレス/GW は mddo-fw の original_asis/hosts/*.json から転記
#   host_if        : データ側インタフェース名（containerlab では eth0 が mgmt のため eth1 を既定とする）
#   container_name : 実際のコンテナ名が clab_prefix 規則と異なる場合のみ指定
all:
  children:
    lab_hosts:
      children:
        servers:
          children:
            dns_servers:
              hosts:
                site-a-host-1:
                  host_ip: 192.168.100.10
                  host_prefixlen: 24
                  host_gateway: 192.168.100.1
                  host_if: eth1
            web_servers:
              hosts:
                site-a-host-2:
                  host_ip: 192.168.200.10
                  host_prefixlen: 24
                  host_gateway: 192.168.200.1
                  host_if: eth1
        demo_clients:
          children:
            site_b_clients:
              hosts:
                site-b-host-1:
                  host_ip: 192.168.101.10
                  host_prefixlen: 24
                  host_gateway: 192.168.101.1
                  host_if: eth1
                site-b-host-2:
                  host_ip: 192.168.201.10
                  host_prefixlen: 24
                  host_gateway: 192.168.201.1
                  host_if: eth1
            site_c_clients:
              hosts:
                site-c-host-1:
                  host_ip: 192.168.102.10
                  host_prefixlen: 24
                  host_gateway: 192.168.102.1
                  host_if: eth1
                site-c-host-2:
                  host_ip: 192.168.202.10
                  host_prefixlen: 24
                  host_gateway: 192.168.202.1
                  host_if: eth1
