- hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    conductor_address: "{{ remote_address }}:15000"
  tasks:
    - name: 実行対象のコンテナ名を取得
      shell: >-
        docker exec mddo-clab-docker containerlab inspect --all --format json --details |
        jq -r '.emulated[] | select(.Labels.clusterid == "{{ cluster_id | string }}" and .Labels.redundant == "act") | .Names[]'
      register: act_target
      changed_when: false

    - name: qemu-serverディレクトリを共有ディレクトリに内部バインドマウント
      shell: |
        docker exec -i {{ item }} bash -c '
        mkdir -p /var/run/qemu-server
        # 既にマウントされていなければ mount --bind を実行
        if ! mountpoint -q /var/run/qemu-server; then
          mount --bind /opt/qemu-shared /var/run/qemu-server
        fi
        '
      loop: "{{ act_target.stdout_lines }}"
      changed_when: false

    - name: 取得したactのproxmoxコンテナに対して設定スクリプトを実行
      shell: |
        cat << 'SCRIPT_EOF' | docker exec -i {{ item }} bash
        set -e
        rm -rf /tmp/vsrx-config
        mkdir -p /tmp/vsrx-config

        qm stop {{ cluster_id }}00 || true
        qm destroy {{ cluster_id }}00 --purge true || true

        # 1. OVF インポートと仮想マシン構成
        qm importovf {{ cluster_id }}00 /var/tmp/junos-vsrx3-x86-64.ide.ovf local --format qcow2
        qm set {{ cluster_id }}00 --name vsrx1 --memory 8192 --cores 5 --cpu cputype=host --scsihw virtio-scsi-pci
        qm set {{ cluster_id }}00 --serial0 socket --vga serial0
        qm set {{ cluster_id }}00 --scsi0 local:{{ cluster_id }}00/vm-{{ cluster_id }}00-disk-0.qcow2

        # 2. ブート順序は scsi0 のみ（記事では ide2 をブート対象に入れていません）
        qm set {{ cluster_id }}00 --boot "order=scsi0"

        SCRIPT_EOF
      loop: "{{ act_target.stdout_lines }}"
      register: exec_results
      changed_when: true

          
    - name: コンテナ内でProxmoxのネットワーク設定スクリプトを実行
      shell: |
        cat << 'SCRIPT_EOF' | docker exec -i {{ item }} bash
        VMID={{ cluster_id }}00

        echo "=== Proxmox VE ネットワーク連続設定を開始 ==="

        # 【修正箇所】 0..3 ではなく 0..4 にして vmbr1 から vmbr5 までの5つを作成する
        echo "[1/3] コンテナ内に Linux Bridge (vmbr1〜vmbr4) を一括作成中..."
        for i in $(seq 0 $(( {{ num_if }} - 1 ))); do
          ip link add name vmbr$((i + 1)) type bridge || true
          ip link set vmbr$((i + 1)) up || true
        done

        # 2. Containerlabのethポート（eth1〜eth5）を vmbr1〜vmbr5 に収容
        for i in $(seq 0 $(( {{ num_if }} - 1 ))); do
          ip link set eth$((i + 1 )) master vmbr$((i + 1)) || true
          ip link set eth$((i + 1 )) up || true
        done

        # 3. ProxmoxのVM構成ファイルから古いネットワーク設定を掃除し、新規に一括書き込み
        echo "[3/3] VM $VMID の構成ファイルに net0〜net3 を直接書き込み中..."

        # 競合を防ぐため、既存の net0 〜 net4 の設定行を削除
        for i in $(seq 0 $(( {{ num_if }} - 1 ))); do
          sed -i "/^net$i:/d" /etc/pve/qemu-server/$VMID.conf
        done

        # 新しい設定(net0:vmbr1 〜 net4:vmbr5)を一括追加
        for i in $(seq 0 $(( {{ num_if }} - 1 ))); do
          sh -c "echo 'net$i: virtio,bridge=vmbr$((i+1))' >> /etc/pve/qemu-server/$VMID.conf"
        done

        echo "=== Proxmox内の設定ファイルにブリッジを正式登録します ==="

        # vmbr1 から vmbr4 までの定義を /etc/network/interfaces の末尾に一括追記
        for i in $(seq 0 $(( {{ num_if }} - 1 ))); do
          sh -c "echo '' >> /etc/network/interfaces"
          sh -c "echo 'iface vmbr$((i + 1)) inet manual' >> /etc/network/interfaces"
          sh -c "echo '        bridge-ports none' >> /etc/network/interfaces"
          sh -c "echo '        bridge-stp off' >> /etc/network/interfaces"
          sh -c "echo '        bridge-fd 0' >> /etc/network/interfaces"
        done
        SCRIPT_EOF
      loop: "{{ act_target.stdout_lines }}"
      register: network_setup_results
      changed_when: true

    - name: ネットワーク設定(IP)とVM(VMID:{{ cluster_id }}00)の起動
      shell: |
        cat << 'SCRIPT_EOF' | docker exec -i {{ item }} bash
        ip addr add 192.168.100.1/24 dev vmbr1 || true
        ip link set vmbr1 up || true
        qm start {{ cluster_id }}00
        SCRIPT_EOF
      loop: "{{ act_target.stdout_lines }}"
      register: vm_start_results
      changed_when: true

    - name: 対象のProxmoxコンテナのシリアルソケット経由でvSRXに初期設定を注入
      proxmox_serial_exec:
        socket_path: "/tmp/proxmox-shared/qemu/{{ cluster_id }}00.serial0"
        container: "{{ item }}"
        vmid: "{{ cluster_id }}00"
        password: "{{ password }}"
        timeout: 600
        commands:
          - "cli"
          - "set cli screen-length 0"
          - "set cli screen-width 511"
          - "configure"
          - "set system host-name vsrx"
          - "set system services netconf ssh"
          - "set system services ssh root-login allow"
          - 'set system root-authentication plain-text-password-value "{{ password }}"'
          - "commit and-quit"
      loop: "{{ act_target.stdout_lines }}"
      register: serial_results

    # SBY 
    - name: 実行対象のコンテナ名を取得
      shell: >-
        docker exec mddo-clab-docker containerlab inspect --all --format json --details |
        jq -r '.emulated[] | select(.Labels.clusterid == "{{ cluster_id }}" and .Labels.redundant == "sby") | .Names[]'
      register: sby_target
      changed_when: false

    - name: qemu-serverディレクトリを共有ディレクトリに内部バインドマウント
      shell: |
        docker exec -i {{ item }} bash -c '
        mkdir -p /var/run/qemu-server
        # 既にマウントされていなければ mount --bind を実行
        if ! mountpoint -q /var/run/qemu-server; then
          mount --bind /opt/qemu-shared /var/run/qemu-server
        fi
        '
      loop: "{{ sby_target.stdout_lines }}"
      changed_when: false

    - name: 取得したsbyのproxmoxコンテナに対して設定スクリプトを実行
      shell: |
        cat << 'SCRIPT_EOF' | docker exec -i {{ item }} bash
        set -e
        rm -rf /tmp/vsrx-config
        mkdir -p /tmp/vsrx-config

        qm stop {{ cluster_id }}01 || true
        qm destroy {{ cluster_id }}01 --purge true || true

        # 1. OVF インポートと仮想マシン構成
        qm importovf {{ cluster_id }}01 /var/tmp/junos-vsrx3-x86-64.ide.ovf local --format qcow2
        qm set {{ cluster_id }}01 --name vsrx1 --memory 8192 --cores 5 --cpu cputype=host --scsihw virtio-scsi-pci
        qm set {{ cluster_id }}01 --serial0 socket --vga serial0
        qm set {{ cluster_id }}01 --scsi0 local:{{ cluster_id }}01/vm-{{ cluster_id }}01-disk-0.qcow2

        # 2. ブート順序は scsi0 のみ（記事では ide2 をブート対象に入れていません）
        qm set {{ cluster_id }}01 --boot "order=scsi0"

        SCRIPT_EOF
      loop: "{{ sby_target.stdout_lines }}"
      register: exec_results
      changed_when: true

          
    - name: コンテナ内でProxmoxのネットワーク設定スクリプトを実行
      shell: |
        cat << 'SCRIPT_EOF' | docker exec -i {{ item }} bash
        VMID={{ cluster_id }}01
        echo "=== Proxmox VE ネットワーク連続設定を開始 ==="

        # 【修正箇所】 0..3 ではなく 0..4 にして vmbr1 から vmbr5 までの5つを作成する
        echo "[1/3] コンテナ内に Linux Bridge (vmbr1〜vmbr4) を一括作成中..."
        for i in $(seq 0 $(( {{ num_if }} - 1 ))); do
          ip link add name vmbr$((i + 1)) type bridge || true
          ip link set vmbr$((i + 1)) up || true
        done

        # 2. Containerlabのethポート（eth1〜eth5）を vmbr1〜vmbr5 に収容
        for i in $(seq 0 $(( {{ num_if }} - 1 ))); do
          ip link set eth$((i + 1 )) master vmbr$((i + 1)) || true
          ip link set eth$((i + 1 )) up || true
        done

        # 3. ProxmoxのVM構成ファイルから古いネットワーク設定を掃除し、新規に一括書き込み
        echo "[3/3] VM $VMID の構成ファイルに net0〜net3 を直接書き込み中..."

        # 競合を防ぐため、既存の net0 〜 net4 の設定行を削除
        for i in $(seq 0 $(( {{ num_if }} - 1 ))); do
          sed -i "/^net$i:/d" /etc/pve/qemu-server/$VMID.conf
        done

        # 新しい設定(net0:vmbr1 〜 net4:vmbr5)を一括追加
        for i in $(seq 0 $(( {{ num_if }} - 1 ))); do
          sh -c "echo 'net$i: virtio,bridge=vmbr$((i+1))' >> /etc/pve/qemu-server/$VMID.conf"
        done

        echo "=== Proxmox内の設定ファイルにブリッジを正式登録します ==="

        # vmbr1 から vmbr4 までの定義を /etc/network/interfaces の末尾に一括追記
        for i in $(seq 0 $(( {{ num_if }} - 1 ))); do
          sh -c "echo '' >> /etc/network/interfaces"
          sh -c "echo 'iface vmbr$((i + 1)) inet manual' >> /etc/network/interfaces"
          sh -c "echo '        bridge-ports none' >> /etc/network/interfaces"
          sh -c "echo '        bridge-stp off' >> /etc/network/interfaces"
          sh -c "echo '        bridge-fd 0' >> /etc/network/interfaces"
        done
        SCRIPT_EOF

      loop: "{{ sby_target.stdout_lines }}"
      register: network_setup_results
      changed_when: true

    - name: ネットワーク設定(IP)とVM(VMID:{{ cluster_id }}01)の起動
      shell: |
        cat << 'SCRIPT_EOF' | docker exec -i {{ item }} bash
        ip addr add 192.168.100.1/24 dev vmbr1 || true
        ip link set vmbr1 up || true
        qm start {{ cluster_id }}01
        SCRIPT_EOF
      loop: "{{ sby_target.stdout_lines }}"
      register: vm_start_results
      changed_when: true

    - name: 対象のProxmoxコンテナのシリアルソケット経由でvSRXに初期設定を注入
      proxmox_serial_exec:
        socket_path: "/tmp/proxmox-shared/qemu/{{ cluster_id }}01.serial0"
        container: "{{ item }}"
        vmid: "{{ cluster_id }}01"
        timeout: 600
        password: "{{ password }}"
        commands:
          - "cli"
          - "set cli screen-length 0"
          - "set cli screen-width 511"
          - "configure"
          - "set system host-name vsrx"
          - "set system services ssh root-login allow"
          - "set system services netconf ssh"
          - 'set system root-authentication plain-text-password-value "{{ password }}"'
          - "commit and-quit"
      loop: "{{ sby_target.stdout_lines }}"
      register: serial_results

    # 実行ログの確認
    - name: 実行ログの確認
      debug:
        msg:
          - "Target Container: {{ item.item }}"
          - "Socket: {{ item.socket_used }}"
          - "Output: {{ item.stdout_lines }}"
      loop: "{{ serial_results.results }}"

    # --- 1-1. シャーシクラスタ化の有効化とリブート ---
    - name: シャーシクラスタを有効化してvSRXを再起動
      proxmox_serial_exec:
        socket_path: "/tmp/proxmox-shared/qemu/{{ cluster_id }}00.serial0"
        expect_reboot: true
        timeout: 600
        # cliモードに入ってからオペレーショナルコマンドを発行
        commands:
          - "cli"
          - "set chassis cluster cluster-id {{ cluster_id }} node {{ node_id | default(0) }} reboot"
      vars:
        cluster_id: "{{ cluster_id }}"
        node_id: "{{ node_0_id }}"
      loop: "{{ act_target.stdout_lines }}"

    # --- 1-2. シャーシクラスタ化の有効化とリブート ---
    - name: シャーシクラスタを有効化してvSRXを再起動
      proxmox_serial_exec:
        socket_path: "/tmp/proxmox-shared/qemu/{{ cluster_id }}01.serial0"
        expect_reboot: true
        timeout: 600
        # cliモードに入ってからオペレーショナルコマンドを発行
        commands:
          - "cli"
          - "set chassis cluster cluster-id {{ cluster_id }} node {{ node_id | default(0) }} reboot"
      vars:
        cluster_id: "{{ cluster_id }}"
        node_id: "{{ node_1_id }}"
      loop: "{{ sby_target.stdout_lines }}"


    # --- 3. クラスタ設定の注入 ---
    - name: クラスタ用のインターフェースおよび冗長化設定を注入
      proxmox_serial_exec:
        socket_path: "/tmp/proxmox-shared/qemu/{{ cluster_id }}00.serial0"
        timeout: 600
        password: "{{ password }}"
        commands:
          - "cli"
          - "set cli screen-length 0"
          - "set cli screen-width 511"
          - "configure"

          # --- ノード個別設定 ---
          - "set groups node0 system host-name vsrx-node0"
          - "set groups node0 interfaces fxp0 unit 0 family inet address {{ node_0_ip }}"
          - "set groups node1 system host-name vsrx-node1"
          - "set groups node1 interfaces fxp0 unit 0 family inet address {{ node_1_ip }}"
          - 'set apply-groups "${node}"'

          # --- クラスタ基盤設定 ---
          - "set chassis cluster reth-count 1"
          - "set chassis cluster redundancy-group 0 node 0 priority 100"
          - "set chassis cluster redundancy-group 0 node 1 priority 1"
          - "set chassis cluster redundancy-group 1 node 0 priority 100"
          - "set chassis cluster redundancy-group 1 node 1 priority 1"

          # --- インターフェース設定 ---
          # fab0 は Node0 なので ge-0/0/0
          - "set interfaces fab0 fabric-options member-interfaces {{ node_0_if }}"
          # 【修正】fab1 は Node1 なのでオフセットを加算して ge-7/0/0 を指定
          - "set interfaces fab1 fabric-options member-interfaces {{ node_1_if }}"

          #- "set interfaces ge-0/0/1 gigether-options redundant-parent reth0"
          #- "set interfaces reth0 redundant-ether-options redundancy-group 1"
          #- "set interfaces reth0 unit 0 family inet address 10.0.0.1/24"

          - "commit and-quit"
      loop: "{{ act_target.stdout_lines }}"
      register: cluster_config_results
        
    - name: portforward
      shell: |
        cat << 'SCRIPT_EOF' | docker exec -i {{ item }} bash
        sysctl -w net.ipv4.ip_forward=1
        nft add table ip nat
        nft add chain ip nat PREROUTING  '{ type nat hook prerouting  priority dstnat; }'
        nft add chain ip nat POSTROUTING '{ type nat hook postrouting priority srcnat; }'
        nft delete rule ip nat PREROUTING  tcp dport 22 dnat to 192.168.100.2:22
        nft add rule ip nat PREROUTING  tcp dport 22 dnat to 192.168.100.2:22
        nft add rule ip nat POSTROUTING ip daddr 192.168.100.2 tcp dport 22 masquerade
        ping -c 2 192.168.100.2 || true # ARPテーブルの事前解決        
        SCRIPT_EOF
      loop: "{{ act_target.stdout_lines }}"
      register: exec_results
      changed_when: true

    - name: portforward
      shell: |
        cat << 'SCRIPT_EOF' | docker exec -i {{ item }} bash
        sysctl -w net.ipv4.ip_forward=1
        nft add table ip nat
        nft add chain ip nat PREROUTING  '{ type nat hook prerouting  priority dstnat; }'
        nft add chain ip nat POSTROUTING '{ type nat hook postrouting priority srcnat; }'
        nft delete rule ip nat PREROUTING  tcp dport 22 dnat to 192.168.100.3:22
        nft add rule ip nat PREROUTING  tcp dport 22 dnat to 192.168.100.3:22
        nft add rule ip nat POSTROUTING ip daddr 192.168.100.3 tcp dport 22 masquerade
        ping -c 2 192.168.100.3 || true # ARPテーブルの事前解決        
        SCRIPT_EOF
      loop: "{{ sby_target.stdout_lines }}"
      register: exec_results
      changed_when: true
