- hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    with_clab: "{{ with_clab }}"
    iperf_params_file:  "/clab/iperf_params.json"  # in remote host path
    topology_file: "/clab/clab-topo.yaml"
    remote_address: localhost
    conductor_address: "{{ remote_address }}:15000"

  tasks:
    - name: delete config file
      shell: rm -f /clab/*.conf

    - name: delete topo file
      shell: rm  -f /clab/clab-topo.yaml

    - name: delete iperf file
      shell: rm -f /clab/iperf_params.json

    - shell: 'echo "job_status{jobname=\"Preparing_Deploy_Clab\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 1" > /prom/textfile.prom'
    - name: "get convert table"
      uri:
        url: "http://{{ conductor_address }}/topologies/{{ network_name }}/{{ snapshot_name }}/topology/layer3/config_params"
        method: "GET"
        body_format: json
      register: layer3_convert_table

    - name: download generated config
      shell: "curl {{ url }}/{{ item.agent_name }}.conf | jq -r .text > {{ filepath }}"
      vars:
        url: "http://{{ conductor_address }}/configs/{{ network_name }}/{{ snapshot_name }}"
        filepath: "/clab/{{ item.agent_name }}.conf"
      loop: "{{ layer3_convert_table.json }}"

    - name: "get convert table"
      uri:
        url: "http://{{ conductor_address }}/topologies/{{ network_name }}/{{ snapshot_name }}/topology/layer3/config_params"
        method: "GET"
        body_format: json
      register: layer3_convert_table

    - name: "get clab topo yaml"
      uri:
        url: "http://{{ conductor_address }}/topologies/{{ network_name }}/{{ snapshot_name }}/topology/layer3/containerlab_topology?image={{ crpd_image }}&bind_license=license.key:/tmp/license.key:ro&endpoint_image={{ endpoint_image }}&usecase={{ usecase_name }}"
        method: "GET"
        body_format: json
      register: containerlab

    - name: "Creating clab-topo.yaml"
      copy:
        dest: "/clab/clab-topo.yaml"
        content: "{{ containerlab.json | to_nice_yaml }}"

    - shell: 'echo "job_status{jobname=\"Preparing_Deploy_Clab\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 0" > /prom/textfile.prom'

    - shell: 'echo "job_status{jobname=\"Setting_ovs-br\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 1" >> /prom/textfile.prom'

    - name: "delete ovs-br {{ item.key }}"
      shell: "docker exec  mddo-clab-docker ovs-vsctl del-br {{ item.key }}"
      when: with_clab == "true" and "ovs" in item.value.kind
      loop: "{{ lookup( 'ansible.builtin.dict', containerlab.json.topology.nodes) }}"
      ignore_errors: true

    - name: "create ovs-br {{ item.key }}"
      shell: "docker exec  mddo-clab-docker ovs-vsctl add-br {{ item.key }}"
      when: with_clab == "true" and "ovs" in item.value.kind
      loop: "{{ lookup( 'ansible.builtin.dict', containerlab.json.topology.nodes) }}"
      ignore_errors: true

    - shell: 'echo "job_status{jobname=\"Setting_ovs-br\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 0" > /prom/textfile.prom'

    - shell: 'echo "job_status{jobname=\"Deploying_Containerlab\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 1" >> /prom/textfile.prom'

    - name: deploy containerlab
      shell:
        cmd: "docker exec  mddo-clab-docker containerlab deploy --topo clab-topo.yaml --reconfigure"
      when: with_clab == "true"

    - name: Pause for 30 sec to build app cache
      ansible.builtin.pause:
        seconds: 30

    - name: enable bgp license
      shell:
        cmd: "docker exec  mddo-clab-docker containerlab exec --topo clab-topo.yaml --label clab-node-kind=juniper_crpd --cmd 'cli request system license add /tmp/license.key'"
      when:
        with_clab == "true"

    - shell: 'echo "job_status{jobname=\"Deploying_Containerlab\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 0" >> /prom/textfile.prom'

    - name: get interface list for empty node
      uri:
        url: "http://{{ conductor_address }}/topologies/{{ network_name }}/{{ snapshot_name }}/topology/layer3/interfaces?node_name=Seg_empty00"
        method: "GET"
        body_format: json
      register: shutdown_interface_response
            
    - name: extract l1_principal values
      set_fact:
        shutdown_interface_list: "{{ shutdown_interface_response.json.nodes[0].interfaces | map(attribute='alias.l1_principal') | list }}"
      ignore_errors: true

    - name: shutdown interfaces
      shell: "docker exec mddo-clab-docker ip link set {{ item }} down"
      loop: "{{ shutdown_interface_list }}"
      ignore_errors: true

    - name: Read Containerlab topology file
      ansible.builtin.set_fact:
        topo_data: "{{ lookup('file', topology_file) | from_yaml }}"

    - name: Extract cluster_id and calculate num_if for active junos nodes
      ansible.builtin.set_fact:
        extracted_data: >-
          {%- set results = [] -%}
          {%- for node_name, node_attrs in topo_data.topology.nodes.items() -%}
            {%- if node_attrs.labels is defined and 
                   node_attrs.labels.get('ansible-group') == 'junos' and 
                   node_attrs.labels.get('redundant') == 'act' -%}
              
              {%- set c_id = node_attrs.labels.get('clusterid') -%}
              
              {#- リンク情報から ethX の番号を抽出 -#}
              {%- set eth_nums = [] -%}
              {%- for link in topo_data.topology.links -%}
                {%- for ep in link.endpoints -%}
                  {%- if ep.startswith(node_name ~ ':eth') -%}
                    {%- set num = ep.split(':eth')[1] | int -%}
                    {%- set _ = eth_nums.append(num) -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              
              {#- ethX の最大値を取得 (インターフェースが存在しない場合は0) -#}
              {%- set max_eth = (eth_nums | max) if eth_nums | length > 0 else 0 -%}
              
              {%- set _ = results.append({
                'node': node_name,
                'cluster_id': c_id,
                'num_if': max_eth
              }) -%}
              
            {%- endif -%}
          {%- endfor -%}
          {{ results }}

    - name: Show all extracted target data (for debugging)
      ansible.builtin.debug:
        var: extracted_data

    - name: Deploy vSRX HA and Apply Initial Config
      when:
        - with_clab | default('true') == 'true'
        - extracted_data | length > 0
      block:
        - shell: 'echo "job_status{jobname=\"Deploying_vSRX_HA\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 1" >> /prom/textfile.prom'

        - name: Reset portforwarding rule in active containers before triggering
          ansible.builtin.shell: >
            docker exec clab-{{ snapshot_name }}-{{ item.node }} nft delete rule ip nat PREROUTING tcp dport 22 dnat to 192.168.100.2:22 || true
          loop: "{{ extracted_data }}"
          changed_when: false

        - name: Trigger EDA Rulebook endpoint for each extracted cluster
          ansible.builtin.uri:
            url: "http://127.0.0.1:48090/"
            method: POST
            body_format: json
            body:
              message: "vsrx_ha"
              snapshot_name: "{{ snapshot_name }}"
              cluster_id: "{{ item.cluster_id }}"
              num_if: "{{ item.num_if }}"
              remote_address: "172.32.0.1"
          loop: "{{ extracted_data }}"

        - name: Show triggering result for vsrx_ha
          ansible.builtin.debug:
            msg: "Triggered vsrx_ha rule for Node: {{ item.node }}, Cluster ID: {{ item.cluster_id }}, num_if: {{ item.num_if }}"
          loop: "{{ extracted_data }}"

        - name: Wait for vsrx_ha parallel executions to complete on all active nodes
          ansible.builtin.shell: >
            docker exec clab-{{ snapshot_name }}-{{ item.node }} nft list chain ip nat PREROUTING 2>/dev/null | grep -q "dnat to 192.168.100.2:22"
          register: nft_check
          until: nft_check.rc == 0
          retries: 180  # 10秒 x 180回 = 最大30分待機
          delay: 10
          changed_when: false
          loop: "{{ extracted_data }}"

        - shell: 'echo "job_status{jobname=\"Deploying_vSRX_HA\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 0" > /prom/textfile.prom'

        - name: Wait a brief moment for vSRX NETCONF/SSH service to stabilize
          ansible.builtin.pause:
            seconds: 10

        - shell: 'echo "job_status{jobname=\"Configuring_vSRX\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 1" >> /prom/textfile.prom'

        - name: Trigger EDA Rulebook endpoint for vSRX configuration (vsrx_config)
          ansible.builtin.uri:
            url: "http://127.0.0.1:48090/"
            method: POST
            body_format: json
            body:
              message: "vsrx_config"
              snapshot_name: "{{ snapshot_name }}"

        - name: Show vsrx_config triggering result
          ansible.builtin.debug:
            msg: "All vsrx_ha parallel tasks completed. Triggered vsrx_config successfully for snapshot: {{ snapshot_name }}"

        - shell: 'echo "job_status{jobname=\"Configuring_vSRX\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 0" > /prom/textfile.prom'
