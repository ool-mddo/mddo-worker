- hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    with_clab: "true"
    iperf_params_file: "/clab/iperf_params.json"  # in remote host path
    remote_address: localhost
    conductor_address: "{{ remote_address }}:15000"

  tasks:
    #- name: restart iperf node
    #  ansible.builtin.shell: "docker exec mddo-clab-docker {{ exec_container }}"
    #  vars:
    #    exec_container: "docker ps | grep clab | grep endpoint | cut -d ' ' -f 1 | xargs -INODE docker restart NODE --time=1"

    - name: update job_status (Preparing_Deploy_Clab=1)
      ansible.builtin.shell: 'echo "job_status{jobname=\"Preparing_Deploy_Clab\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 1" > /prom/textfile.prom'

    - name: "get convert table"
      ansible.builtin.uri:
        url: "http://{{ conductor_address }}/topologies/{{ network_name }}/{{ snapshot_name }}/topology/layer3/config_params"
        method: "GET"
        body_format: json
      register: layer3_convert_table

    - name: update job_status (Preparing_IperfNode=1)
      ansible.builtin.shell: 'echo "job_status{jobname=\"Preparing_IperfNode\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 1" >> /prom/textfile.prom'

    - name: "get layer3 topology (select endpoint node)"
      ansible.builtin.uri:
        url: "http://{{ conductor_address }}/topologies/{{ network_name }}/{{ snapshot_name }}/topology/layer3/interfaces?node_type=endpoint"
        method: "GET"
        body_format: json
      register: layer3_nodes

    - name: generate iperf endpoint static-route info
      ansible.builtin.set_fact:
        iperf_list: "{{ iperf_list | default([]) + [ item ] }}"
      loop: "{{ layer3_nodes.json | community.general.json_query('nodes[*]') }}"

    - name: setting eth1 & default routing (debug)
      ansible.builtin.debug:
        msg: "{{ exec_container }} {{ add_eth1_ip }}; {{ exec_container }} {{ del_default_route }}; {{ exec_container }} {{ add_default_route }}; {{ exec_container }}  {{ mtu_1500 }}"
      vars:
        exec_container: "docker exec  mddo-clab-docker containerlab inspect --all --format json | jq '.emulated[] | select( .name | contains (\"{{ item['node'] }}\")) | .name' | xargs -ICONTAINER docker exec CONTAINER "
        add_eth1_ip: 'ip addr add {{ item["interfaces"][0]["attribute"]["ip-address"][0] }} dev eth1 '
        del_default_route: "ip route del default via 172.20.20.1"
        add_default_route: 'ip route add default via {{ item["attribute"]["static-route"][0]["next-hop"] }}'
        mtu_1500: 'ip link set dev eth1 mtu 1500'
      loop: "{{ iperf_list | default([]) }}"

    - name: setting eth1 & default routing
      ansible.builtin.shell:
        cmd: "{{ exec_container }} {{ add_eth1_ip }}; {{ exec_container }} {{ del_default_route }}; {{ exec_container }} {{ add_default_route }}; {{ exec_container }}  {{ mtu_1500 }}"
      vars:
        exec_container: "docker exec  mddo-clab-docker containerlab inspect --all --format json | jq '.emulated[] | select( .name | contains (\"{{ item['node'] }}\")) | .name' | xargs -ICONTAINER docker exec CONTAINER "
        add_eth1_ip: 'ip addr add {{ item["interfaces"][0]["attribute"]["ip-address"][0] }} dev eth1 '
        del_default_route: "ip route del default via 172.20.20.1"
        add_default_route: 'ip route add default via {{ item["attribute"]["static-route"][0]["next-hop"] }}'
        mtu_1500: 'ip link set dev eth1 mtu 1500'
      loop: "{{ iperf_list | default([]) }}"
      ignore_errors: true
      when: with_clab | bool

    - name: iperf process stop
      ansible.builtin.shell:
        cmd: '{{ exec_container }} /bin/bash -c "pkill iperf"'
      vars:
        exec_container: "docker exec  mddo-clab-docker containerlab inspect --all --format json | jq '.emulated[] | select( .name | contains (\"{{ item['node'] }}\")) | .name' | xargs -ICONTAINER docker exec CONTAINER "
      loop: "{{ iperf_list | default([]) }}"
      ignore_errors: true
      when: with_clab | bool

    - name: Save iperf commands data to a file
      ansible.builtin.copy:
        content: "{{ iperf_commands if iperf_commands is string else (iperf_commands | to_nice_json) }}"
        dest: "{{ iperf_params_file }}"

    - name: update job_status (Preparing_IperfNode=0)
      ansible.builtin.shell: 'echo "job_status{jobname=\"Preparing_IperfNode\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 0" > /prom/textfile.prom'

    - name: update job_status (Start_Iperf=1)
      ansible.builtin.shell: 'echo "job_status{jobname=\"Start_Iperf\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 1" >> /prom/textfile.prom'

    - name: iperf server command (debug)
      ansible.builtin.debug:
        msg: '{{ exec_container }} /bin/bash -c "nohup iperf3 -s -p {{ item.1.server_port }} > out_{{ item.1.server_port }}.log &"'
      vars:
        exec_container: "docker exec  mddo-clab-docker containerlab inspect --all --format json | jq '.emulated[] | select( .name | contains (\"{{ item.0['server_node'] }}\")) | .name' | xargs -ICONTAINER docker exec CONTAINER "
      loop: "{{ (lookup('ansible.builtin.file', iperf_params_file) | from_yaml) | subelements('clients') }}"

    - name: iperf server command
      ansible.builtin.shell:
        cmd: '{{ exec_container }} /bin/bash -c "nohup iperf3 -s -p {{ item.1.server_port }} > out_{{ item.1.server_port }}.log 2>&1 &"'
      vars:
        exec_container: "docker exec  mddo-clab-docker containerlab inspect --all --format json | jq '.emulated[] | select( .name | contains (\"{{ item.0['server_node'] }}\")) | .name' | xargs -ICONTAINER docker exec CONTAINER "
      loop: "{{ (lookup('ansible.builtin.file', iperf_params_file) | from_yaml) | subelements('clients') }}"
      when: with_clab | bool

    - name: iperf client command (debug)
      ansible.builtin.debug:
        msg: '{{ exec_container }} /bin/bash -c "nohup iperf3 -t 0 -c {{ item.1["server_address"] }} -b {{ item.1.rate | int }}K -p {{ item.1.server_port }} > out_{{ item.0.server_node }}.log &"'
      vars:
        exec_container: "docker exec  mddo-clab-docker containerlab inspect --all --format json | jq '.emulated[] | select( .name | contains (\"{{ item.1['client_node'] }}\")) | .name' | xargs -ICONTAINER docker exec CONTAINER "
      loop: "{{ (lookup('ansible.builtin.file', iperf_params_file) | from_yaml) | subelements('clients') }}"

    - name: iperf client command
      ansible.builtin.shell:
        cmd: '{{ exec_container }} /bin/bash -c "nohup iperf3 -t 0 -c {{ item.1["server_address"] }} -b {{ item.1.rate | int }}K -p {{ item.1.server_port }} > out_{{ item.0.server_node }}.log 2>&1 &"'
      vars:
        exec_container: "docker exec  mddo-clab-docker containerlab inspect --all --format json | jq '.emulated[] | select( .name | contains (\"{{ item.1['client_node'] }}\")) | .name' | xargs -ICONTAINER docker exec CONTAINER "
      loop: "{{ (lookup('ansible.builtin.file', iperf_params_file) | from_yaml) | subelements('clients') }}"
      when: with_clab | bool

    - name: update job_status (Start_Iperf=0)
      ansible.builtin.shell: 'echo "job_status{jobname=\"Start_Iperf\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 0" > /prom/textfile.prom'

    - name: update job_status (AllJob_Complete=1)
      ansible.builtin.shell: 'echo "job_status{jobname=\"AllJob_Complete\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 1" > /prom/textfile.prom'

    - name: pause
      ansible.builtin.pause:
        seconds: 10

    - name: update job_status (Iperf Executing=1)
      ansible.builtin.shell: 'echo "job_status{jobname=\"Iperf Executing\",network_name=\"{{ network_name }}\",snapshot_name=\"{{ snapshot_name }}\"} 1" > /prom/textfile.prom'
