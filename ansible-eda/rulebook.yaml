---
- name: deploycontainerlab
  hosts: all
  execution_strategy: parallel

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 48090

  rules:
    - name: clab deploy
      condition: event.payload.message == "clab"
      action:
        run_playbook:
          name: "/playbooks/containerlab.yaml"
          extra_vars:
            network_name: "{{ event.payload.network_name }}"
            crpd_image: "{{ event.payload.crpd_image }}"
            endpoint_image: "{{ event.payload.endpoint_image }}"
            snapshot_name: "{{ event.payload.snapshot_name }}"
            usecase_name: "{{ event.payload.usecase_name }}"
            with_clab: "true"
            remote_address: "{{ event.payload.remote_address }}"
    - name: setup iperf node
      condition: event.payload.message == "iperf"
      action:
        run_playbook:
          name: "/playbooks/iperf.yaml"
          extra_vars:
            network_name: "{{ event.payload.network_name }}"
            crpd_image: "{{ event.payload.crpd_image }}"
            snapshot_name: "{{ event.payload.snapshot_name }}"
            usecase_name: "{{ event.payload.usecase_name }}"
            with_clab: "true"
            iperf_commands: "{{ event.payload.iperf_commands}}"
            remote_address: "{{ event.payload.remote_address }}"
    - name: clab destroy
      condition: event.payload.message == "destroy"
      action:
        run_playbook:
          name: "/playbooks/destroy.yaml"
          extra_vars:
            network_name: "{{ event.payload.network_name }}"
            crpd_image: "{{ event.payload.crpd_image }}"
            endpoint_image: "{{ event.payload.endpoint_image }}"
            snapshot_name: "{{ event.payload.snapshot_name }}"
            usecase_name: "{{ event.payload.usecase_name }}"
            with_clab: "true"
            remote_address: "{{ event.payload.remote_address }}"
    - name: shutdown webhook
      condition: event.payload.message == "shutdown"
      action:
        shutdown:
          delay: 15
          message: "Shutting down"
    - name: operate ovs bridge operation(ovs-vsctl add-port/del-port)
      condition: event.payload.message == "ovs"
      action:
        run_playbook:
          name: "/playbooks/ovs.yaml"
          extra_vars:
            network_name: "{{ event.payload.network_name }}"
            snapshot_name: "{{ event.payload.snapshot_name }}"
            usecase_name: "{{ event.payload.usecase_name }}"
            operation: "{{ event.payload.operation }}"
            bridge_name: "{{ event.payload.bridge_name }}"
            port_name: "{{ event.payload.port_name }}"
    - name: route vsrx ha deployment
      condition: event.payload.message == "vsrx_ha"
      action:
        post_event:
          ruleset: "parallel_vsrx_ha"
          event:
            snapshot_name: "{{ event.payload.snapshot_name | default('emulated_asis') }}"
            message: "{{ event.payload.message }}"
            cluster_id: "{{ event.payload.cluster_id | default(1) }}"
            password: "{{ event.payload.password | default('password123') }}"
            remote_address: "{{ event.payload.remote_address }}"
            num_if: "{{ event.payload.num_if | default(5) }}"
            node_0_id: "{{ event.payload.node_0_id | default(0) }}"
            node_1_id: "{{ event.payload.node_1_id | default(1) }}"
            node_0_ip: "{{ event.payload.node_0_ip | default('169.254.100.2/24') }}"
            node_1_ip: "{{ event.payload.node_1_ip | default('169.254.100.3/24') }}"
            node_0_if: "{{ event.payload.node_0_if | default('ge-0/0/0') }}"
            node_1_if: "{{ event.payload.node_1_if | default('ge-7/0/0') }}"
    - name: vsrx config
      condition: event.payload.message == "vsrx_config"
      action:
        run_playbook:
          name: "/playbooks/vsrx_config.yaml"
          extra_vars:
            snapshot_name: "{{ event.payload.snapshot_name | default('emulated_asis') }}"
    - name: fw demo site (deploy + test + client demo)
      condition: event.payload.message == "fw_demo" and (event.payload.action is not defined or event.payload.action == "all")
      action:
        run_playbook:
          name: "/playbooks/fw_demo/site.yml"
          extra_vars:
            snapshot_name: "{{ event.payload.snapshot_name | default('') }}"
            demo_expected: "{{ event.payload.demo_expected | default('allow') }}"
            client_resolver_mode: "{{ event.payload.client_resolver_mode | default('resolv_conf') }}"
            demo_fail_on_mismatch: "{{ event.payload.demo_fail_on_mismatch | default(true) }}"
            demo_step_pause: false
            target_client_group: "{{ event.payload.target_client_group | default('demo_clients') }}"
    - name: fw demo setup network
      condition: event.payload.message == "fw_demo" and event.payload.action == "setup_network"
      action:
        run_playbook:
          name: "/playbooks/fw_demo/01_setup_network.yml"
          extra_vars:
            snapshot_name: "{{ event.payload.snapshot_name | default('') }}"
    - name: fw demo deploy servers
      condition: event.payload.message == "fw_demo" and event.payload.action == "deploy"
      action:
        run_playbook:
          name: "/playbooks/fw_demo/10_deploy_servers.yml"
          extra_vars:
            snapshot_name: "{{ event.payload.snapshot_name | default('') }}"
    - name: fw demo test servers
      condition: event.payload.message == "fw_demo" and event.payload.action == "test"
      action:
        run_playbook:
          name: "/playbooks/fw_demo/20_test_servers.yml"
          extra_vars:
            snapshot_name: "{{ event.payload.snapshot_name | default('') }}"
    - name: fw demo clients
      condition: event.payload.message == "fw_demo" and event.payload.action == "demo"
      action:
        run_playbook:
          name: "/playbooks/fw_demo/30_demo_clients.yml"
          extra_vars:
            snapshot_name: "{{ event.payload.snapshot_name | default('') }}"
            demo_expected: "{{ event.payload.demo_expected | default('allow') }}"
            client_resolver_mode: "{{ event.payload.client_resolver_mode | default('resolv_conf') }}"
            demo_fail_on_mismatch: "{{ event.payload.demo_fail_on_mismatch | default(true) }}"
            demo_step_pause: false
            target_client_group: "{{ event.payload.target_client_group | default('demo_clients') }}"
    - name: fw demo cleanup
      condition: event.payload.message == "fw_demo" and event.payload.action == "cleanup"
      action:
        run_playbook:
          name: "/playbooks/fw_demo/90_cleanup.yml"
          extra_vars:
            snapshot_name: "{{ event.payload.snapshot_name | default('') }}"
            cleanup_servers: "{{ event.payload.cleanup_servers | default(false) }}"
    - name: inject/recover vsrx fault (link/node/silent)
      condition: event.payload.message == "fw_fault"
      action:
        run_playbook:
          name: "/playbooks/fw_fault.yaml"
          extra_vars:
            snapshot_name: "{{ event.payload.snapshot_name | default('emulated_asis') }}"
            node: "{{ event.payload.node }}"
            mode: "{{ event.payload.mode | default('link') }}"
            state: "{{ event.payload.state | default('down') }}"
            interfaces: "{{ event.payload.interfaces | default('') }}"

- name: parallel_vsrx_ha
  hosts: localhost
  execution_strategy: parallel
  sources: []

  rules:
    - name: vsrx ha deployment parallel
      condition: event.message == "vsrx_ha"
      action:
        run_playbook:
          name: "/playbooks/vsrx_ha.yaml"
          extra_vars:
            snapshot_name: "{{ event.snapshot_name | default('emulated_asis') }}"
            cluster_id: "{{ event.cluster_id }}"
            password: "{{ event.password }}"
            remote_address: "{{ event.remote_address }}"
            num_if: "{{ event.num_if }}"
            node_0_id: "{{ event.node_0_id }}"
            node_1_id: "{{ event.node_1_id }}"
            node_0_ip: "{{ event.node_0_ip }}"
            node_1_ip: "{{ event.node_1_ip }}"
            node_0_if: "{{ event.node_0_if }}"
            node_1_if: "{{ event.node_1_if }}"
